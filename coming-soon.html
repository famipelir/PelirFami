    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    :root {
      --bg: #080b12;
      --panel: #10151f;
      --panel2: #151b27;
      --border: rgba(255,255,255,.09);
      --text: #f5f7fb;
      --muted: #9ba6b7;
      --accent: #7c5cff;
      --accent2: #00d4ff;
      --green: #35d07f;
      --red: #ff5d73;
    }

    body {
      min-height: 100vh;
      font-family:
        "Segoe UI",
        Tahoma,
        Arial,
        sans-serif;

      background:
        radial-gradient(
          circle at 50% 0%,
          rgba(124,92,255,.18),
          transparent 38%
        ),
        radial-gradient(
          circle at 80% 80%,
          rgba(0,212,255,.08),
          transparent 30%
        ),
        var(--bg);

      color: var(--text);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 25px;
    }

    body::before {
      content: "";
      position: fixed;
      inset: 0;
      pointer-events: none;

      background:
        linear-gradient(
          rgba(255,255,255,.015) 1px,
          transparent 1px
        ),
        linear-gradient(
          90deg,
          rgba(255,255,255,.015) 1px,
          transparent 1px
        );

      background-size: 40px 40px;
    }

    .container {
      width: 100%;
      max-width: 760px;
      position: relative;
      z-index: 1;
    }

    /* LANGUAGE */

    .language-box {
      display: flex;
      justify-content: flex-end;
      margin-bottom: 18px;
    }

    select {
      appearance: none;
      border: 1px solid var(--border);
      background: rgba(16,21,31,.9);
      color: var(--text);

      padding: 11px 38px 11px 15px;
      border-radius: 12px;

      font-size: 14px;
      cursor: pointer;

      outline: none;

      background-image:
        linear-gradient(45deg, transparent 50%, #aaa 50%),
        linear-gradient(135deg, #aaa 50%, transparent 50%);

      background-position:
        calc(100% - 18px) 50%,
        calc(100% - 13px) 50%;

      background-size:
        5px 5px,
        5px 5px;

      background-repeat: no-repeat;
    }

    select:hover {
      border-color: rgba(124,92,255,.5);
    }

    option {
      background: #10151f;
      color: white;
    }

    /* CARD */

    .card {
      background:
        linear-gradient(
          145deg,
          rgba(255,255,255,.045),
          rgba(255,255,255,.015)
        );

      border: 1px solid var(--border);
      border-radius: 28px;

      padding: 55px 35px;

      text-align: center;

      box-shadow:
        0 30px 100px rgba(0,0,0,.45),
        inset 0 1px 0 rgba(255,255,255,.04);

      backdrop-filter: blur(18px);
    }

    /* LOGO */

    .logo {
      width: 95px;
      height: 95px;

      object-fit: contain;

      border-radius: 24px;

      margin-bottom: 25px;

      box-shadow:
        0 15px 45px rgba(124,92,255,.25);
    }

    /* ICON */

    .icon {
      width: 92px;
      height: 92px;

      margin: 0 auto 28px;

      border-radius: 50%;

      display: flex;
      align-items: center;
      justify-content: center;

      font-size: 43px;

      background:
        linear-gradient(
          135deg,
          rgba(124,92,255,.22),
          rgba(0,212,255,.12)
        );

      border: 1px solid rgba(124,92,255,.3);

      box-shadow:
        0 20px 50px rgba(124,92,255,.18);
    }

    h1 {
      font-size: clamp(30px, 6vw, 52px);
      line-height: 1.15;
      margin-bottom: 15px;
      font-weight: 800;
    }

    .product {
      color: var(--accent2);
      font-weight: 700;
    }

    .description {
      color: var(--muted);
      font-size: 17px;
      line-height: 1.9;
      max-width: 600px;
      margin: 0 auto 30px;
    }

    /* BADGE */

    .badge {
      display: inline-flex;
      align-items: center;
      gap: 9px;

      padding: 9px 17px;

      border-radius: 50px;

      background: rgba(255,193,7,.08);
      border: 1px solid rgba(255,193,7,.18);

      color: #ffd86a;

      font-size: 14px;
      font-weight: 700;

      margin-bottom: 30px;
    }

    .dot {
      width: 8px;
      height: 8px;

      border-radius: 50%;

      background: #ffc107;

      box-shadow:
        0 0 12px rgba(255,193,7,.8);

      animation: pulse 1.6s infinite;
    }

    @keyframes pulse {
      0%,100% {
        opacity: 1;
        transform: scale(1);
      }

      50% {
        opacity: .4;
        transform: scale(.75);
      }
    }

    /* BUTTONS */

    .buttons {
      display: flex;
      justify-content: center;
      flex-wrap: wrap;
      gap: 12px;
    }

    .btn {
      text-decoration: none;

      display: inline-flex;
      align-items: center;
      justify-content: center;

      min-width: 165px;

      padding: 13px 20px;

      border-radius: 13px;

      font-size: 15px;
      font-weight: 700;

      transition:
        transform .2s ease,
        box-shadow .2s ease,
        border-color .2s ease;
    }

    .btn:hover {
      transform: translateY(-3px);
    }

    .btn-primary {
      color: white;

      background:
        linear-gradient(
          135deg,
          var(--accent),
          #5d3df2
        );

      box-shadow:
        0 12px 30px rgba(124,92,255,.25);
    }

    .btn-secondary {
      color: var(--text);

      background: rgba(255,255,255,.04);

      border: 1px solid var(--border);
    }

    .btn-secondary:hover {
      border-color: rgba(124,92,255,.45);
    }

    /* FOOTER */

    footer {
      margin-top: 25px;

      color: var(--muted);

      font-size: 13px;

      text-align: center;

      line-height: 1.8;
    }

    .made-by {
      margin-top: 5px;
      color: #c2c9d4;
    }

    /* MOBILE */

    @media (max-width: 600px) {

      body {
        padding: 15px;
      }

      .language-box {
        margin-bottom: 12px;
      }

      .card {
        padding: 38px 20px;
        border-radius: 22px;
      }

      .logo {
        width: 78px;
        height: 78px;
      }

      .icon {
        width: 78px;
        height: 78px;
        font-size: 35px;
      }

      .description {
        font-size: 15px;
        line-height: 1.8;
      }

      .buttons {
        flex-direction: column;
      }

      .btn {
        width: 100%;
      }
    }

    /* RTL */

    html[dir="rtl"] .language-box {
      justify-content: flex-start;
    }

    html[dir="ltr"] .language-box {
      justify-content: flex-end;
    }

  </style>
</head>

/* =========================================================
   PRODUCT NAMES
   ========================================================= */

const productNames = {

  android: {
    fa: "PelirFami برای اندروید",
    en: "PelirFami for Android",
    ar: "PelirFami لنظام Android"
  },

  "android-tv": {
    fa: "PelirFami برای Android TV",
    en: "PelirFami for Android TV",
    ar: "PelirFami لـ Android TV"
  },

  "windows-x64": {
    fa: "PelirFami برای Windows x64",
    en: "PelirFami for Windows x64",
    ar: "PelirFami لنظام Windows x64"
  },

  "windows-x86": {
    fa: "PelirFami برای Windows x86",
    en: "PelirFami for Windows x86",
    ar: "PelirFami لنظام Windows x86"
  },

  "windows-arm64": {
    fa: "PelirFami برای Windows ARM64",
    en: "PelirFami for Windows ARM64",
    ar: "PelirFami لنظام Windows ARM64"
  }

};


/* =========================================================
   GET PRODUCT
   ========================================================= */

function getProduct() {

  const params = new URLSearchParams(
    window.location.search
  );

  return params.get("product") || "";

}


/* =========================================================
   LANGUAGE DETECTION
   ========================================================= */

function detectLanguage() {

  const saved =
    localStorage.getItem(LANG_KEY);

  if (
    saved &&
    LANGUAGES[saved]
  ) {
    return saved;
  }


  const browserLanguages =
    navigator.languages &&
    navigator.languages.length
      ? navigator.languages
      : [navigator.language];


  for (
    const browserLanguage of browserLanguages
  ) {

    if (!browserLanguage) continue;

    const code =
      browserLanguage
        .toLowerCase()
        .split("-")[0]
        .split("_")[0];


    if (LANGUAGES[code]) {
      return code;
    }

  }


  return "en";

}


/* =========================================================
   CURRENT LANGUAGE
   ========================================================= */

let currentLang =
  detectLanguage();


/* =========================================================
   TRANSLATION
   ========================================================= */

function t(key) {

  const dictionary =
    translations[currentLang] ||
    translations.en;


  return (
    dictionary[key] ??
    translations.en[key] ??
    key
  );

}


/* =========================================================
   APPLY LANGUAGE
   ========================================================= */

function applyLanguage(
  language,
  save = true
) {

  if (!LANGUAGES[language]) {
    language = "en";
  }


  currentLang =
    language;


  document.documentElement.lang =
    language;


  document.documentElement.dir =
    LANGUAGES[language].dir;


  if (save) {

    localStorage.setItem(
      LANG_KEY,
      language
    );

  }


  /*
   * Static texts
   */

  document
    .querySelectorAll("[data-i18n]")
    .forEach(element => {

      const key =
        element.dataset.i18n;

      element.textContent =
        t(key);

    });


  /*
   * Language selector
   */

  const selector =
    document.getElementById(
      "languageSelect"
    );


  if (selector) {
    selector.value =
      language;
  }


  /*
   * Product name
   */

  updateProductName();

}


/* =========================================================
   UPDATE PRODUCT NAME
   ========================================================= */

function updateProductName() {

  const element =
    document.getElementById(
      "productName"
    );


  if (!element) return;


  const product =
    getProduct();


  if (
    productNames[product] &&
    productNames[product][currentLang]
  ) {

    element.textContent =
      productNames[product][currentLang];

    return;

  }


  if (
    productNames[product] &&
    productNames[product].en
  ) {

    element.textContent =
      productNames[product].en;

    return;

  }


  const fallbackNames = {

    fa: "PelirFami",
    en: "PelirFami",
    ar: "PelirFami"

  };


  element.textContent =
    fallbackNames[currentLang] ||
    "PelirFami";

}


/* =========================================================
   LANGUAGE SELECTOR
   ========================================================= */

document
  .getElementById("languageSelect")
  .addEventListener(
    "change",
    function () {

      applyLanguage(
        this.value,
        true
      );

    }
  );


/* =========================================================
   SYNC BETWEEN TABS
   ========================================================= */

window.addEventListener(
  "storage",
  function (event) {

    if (
      event.key === LANG_KEY &&
      event.newValue &&
      LANGUAGES[event.newValue]
    ) {

      applyLanguage(
        event.newValue,
        false
      );

    }

  }
);


/* =========================================================
   START
   ========================================================= */

applyLanguage(
  currentLang,
  false
);

</script>
