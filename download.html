<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>دانلود Fami Player</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: "Segoe UI", Tahoma, Arial, sans-serif;
            background: #080a12;
            color: white;
            min-height: 100vh;
        }

        .container {
            width: min(900px, 92%);
            margin: auto;
        }

        header {
            padding: 25px 0;
            border-bottom: 1px solid rgba(255,255,255,.08);
        }

        .logo {
            font-size: 22px;
            font-weight: 800;
        }

        .logo span {
            background: linear-gradient(90deg,#a78bfa,#22d3ee);
            -webkit-background-clip: text;
            color: transparent;
        }

        .back {
            display: inline-block;
            margin-top: 25px;
            color: #a78bfa;
        }

        .download-box {
            margin: 80px auto;
            padding: 50px 30px;
            max-width: 700px;
            text-align: center;
            background: rgba(255,255,255,.04);
            border: 1px solid rgba(255,255,255,.09);
            border-radius: 28px;
            box-shadow: 0 20px 80px rgba(0,0,0,.3);
        }

        .icon {
            width: 90px;
            height: 90px;
            margin: auto auto 25px;
            display: grid;
            place-items: center;
            border-radius: 25px;
            font-size: 38px;
            background: linear-gradient(135deg,#7c3aed,#06b6d4);
        }

        h1 {
            font-size: 42px;
            margin-bottom: 10px;
        }

        .subtitle {
            color: #9ca3b3;
            margin-bottom: 35px;
        }

        .version {
            display: flex;
            justify-content: space-between;
            padding: 15px 20px;
            margin-bottom: 25px;
            background: rgba(255,255,255,.04);
            border-radius: 14px;
            color: #b8bdca;
        }

        .version strong {
            color: white;
        }

        .download {
            display: inline-block;
            padding: 15px 35px;
            border-radius: 14px;
            background: linear-gradient(135deg,#7c3aed,#2563eb);
            color: white;
            text-decoration: none;
            font-weight: 800;
            transition: .25s;
        }

        .download:hover {
            transform: translateY(-3px);
        }

        .note {
            margin-top: 25px;
            color: #73798a;
            font-size: 13px;
        }

        footer {
            text-align: center;
            color: #666c7b;
            padding: 30px;
        }
    </style>
</head>

<body>

<header>
    <div class="container">
        <div class="logo">
            <span>FAMI</span> PLAYER
        </div>
    </div>
</header>

<main class="container">

    <a class="back" href="index.html">
        ← بازگشت به صفحه اصلی
    </a>

    <div class="download-box">

        <div class="icon">
            ▶
        </div>

        <h1>دانلود Fami Player</h1>

        <p class="subtitle">
            آخرین نسخه رسمی Fami Player برای اندروید
        </p>

        <div class="version">
            <span>نسخه</span>
            <strong>1.0.0</strong>
        </div>

        <div class="version">
            <span>سیستم‌عامل</span>
            <strong>Android</strong>
        </div>

        <div class="version">
            <span>وضعیت</span>
            <strong>به‌زودی</strong>
        </div>

        <a class="download" href="#">
            ↓ دانلود APK
        </a>

        <div class="note">
            فایل APK هنوز منتشر نشده است.
            پس از انتشار، لینک دانلود رسمی در همین صفحه قرار می‌گیرد.
        </div>

    </div>

</main>

<footer>
    © 2026 Fami Player
</footer>

</body>
</html>
