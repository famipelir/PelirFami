/* زبان‌های رابط انتخاب زبان */
const languageNames = {
fa:"🇮🇷 فارسی",
en:"🇬🇧 English",
ar:"🇸🇦 العربية"
};

function detectBrowserLanguage(){

    const browserLanguages = navigator.languages || [navigator.language];

    for(const language of browserLanguages){

        const code = language.toLowerCase().split("-")[0];

        if(translations[code]){
            return code;
        }
    }

    return "en";
}

function getLanguage(){

    const saved = localStorage.getItem(LANG_STORAGE_KEY);

    if(saved && translations[saved]){
        return saved;
    }

    return detectBrowserLanguage();
}

function setLanguage(lang){

    if(!translations[lang]){
        lang = "en";
    }

    localStorage.setItem(LANG_STORAGE_KEY,lang);

    document.documentElement.lang = lang;

    const rtlLanguages = ["fa","ar","he","ur"];

    document.documentElement.dir =
        rtlLanguages.includes(lang) ? "rtl" : "ltr";

    document.querySelectorAll("[data-i18n]").forEach(element=>{

        const key = element.dataset.i18n;

        if(translations[lang][key] !== undefined){
            element.textContent = translations[lang][key];
        }

    });

    updateLanguageSelector(lang);
}

function createLanguageSelector(){

    const selector = document.getElementById("languageSelector");

    selector.innerHTML = "";

    Object.keys(languageNames).forEach(lang=>{

        const option = document.createElement("option");

        option.value = lang;
        option.textContent = languageNames[lang];

        selector.appendChild(option);

    });

    selector.addEventListener("change",()=>{

        setLanguage(selector.value);

    });
}

function updateLanguageSelector(lang){

    const selector = document.getElementById("languageSelector");

    if(selector){
        selector.value = lang;
    }
}

const currentLanguage = getLanguage();

createLanguageSelector();
setLanguage(currentLanguage);

const RELEASE_API =
"https://api.github.com/repos/famipelir/PelirFami/releases/latest";

const comingSoon = product =>
`coming-soon.html?product=${encodeURIComponent(product)}`;

async function setupDownloads(){

    let assets = [];

    try{

        const response = await fetch(RELEASE_API);

        if(response.ok){

            const release = await response.json();

            assets = release.assets || [];

        }

    }catch(error){

        console.log("GitHub Release unavailable.");

    }

    function findAsset(patterns){

        return assets.find(asset =>
            patterns.some(pattern =>
                asset.name.toLowerCase().includes(pattern)
            )
        );

    }

    const android =
        findAsset(["android",".apk"]);

    const androidTv =
        findAsset(["androidtv","android-tv","tv"]);

    const windowsX64 =
        findAsset(["windows-x64","win-x64","x64"]);

    function setLink(id,asset,fallback){

        const element = document.getElementById(id);

        if(!element) return;

        element.href =
            asset ? asset.browser_download_url : fallback;

    }

    setLink(
        "androidDownload",
        android,
        comingSoon("android")
    );

    setLink(
        "mainAndroid",
        android,
        comingSoon("android")
    );

    setLink(
        "androidTvDownload",
        androidTv,
        comingSoon("android-tv")
    );

    setLink(
        "windowsDownload",
        windowsX64,
        comingSoon("windows-x64")
    );

    setLink(
        "mainWindows",
        windowsX64,
        comingSoon("windows-x64")
    );
}

setupDownloads();
</script>

</body>
</html>
