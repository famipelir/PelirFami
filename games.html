<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">

<title>PelirFami | Game Center</title>

<style>

*{
box-sizing:border-box;
margin:0;
padding:0;
}

:root{
--bg:#080b12;
--panel:#101521;
--panel2:#151b29;
--border:#252d3d;
--text:#f5f7fb;
--muted:#9ca6b8;
--accent:#7c5cff;
--accent2:#00d4ff;
--green:#20d67b;
--red:#ff5570;
--yellow:#ffc857;
}

body{
font-family:Tahoma,Arial,sans-serif;
background:
radial-gradient(circle at top right,#17113a,transparent 35%),
var(--bg);
color:var(--text);
min-height:100vh;
}

a{
color:inherit;
text-decoration:none;
}

.container{
width:min(1150px,92%);
margin:auto;
}

nav{
position:sticky;
top:0;
z-index:1000;
background:rgba(8,11,18,.85);
backdrop-filter:blur(15px);
border-bottom:1px solid var(--border);
}

.nav{
height:70px;
display:flex;
align-items:center;
justify-content:space-between;
gap:15px;
}

.logo{
display:flex;
align-items:center;
gap:10px;
font-weight:bold;
font-size:20px;
}

.logo img{
width:42px;
height:42px;
border-radius:12px;
}

.nav-right{
display:flex;
align-items:center;
gap:10px;
}

.lang{
background:var(--panel);
border:1px solid var(--border);
color:#fff;
padding:8px;
border-radius:10px;
}

.hero{
padding:65px 0 35px;
text-align:center;
}

.hero h1{
font-size:clamp(40px,7vw,65px);
margin-bottom:10px;
}

.hero p{
color:var(--muted);
}

.filters{
display:flex;
justify-content:center;
gap:10px;
margin:30px 0;
flex-wrap:wrap;
}

.filter{
border:1px solid var(--border);
background:var(--panel);
color:#fff;
padding:10px 18px;
border-radius:12px;
cursor:pointer;
}

.filter.active{
background:linear-gradient(135deg,var(--accent),#5d7cff);
}

.games{
display:grid;
grid-template-columns:repeat(3,1fr);
gap:18px;
padding-bottom:50px;
}

.game{
background:var(--panel);
border:1px solid var(--border);
border-radius:20px;
padding:22px;
transition:.2s;
}

.game:hover{
transform:translateY(-4px);
border-color:#3a4560;
}

.game-icon{
font-size:48px;
margin-bottom:10px;
}

.game h3{
margin-bottom:5px;
}

.game p{
color:var(--muted);
font-size:14px;
margin-bottom:18px;
}

.btn{
border:none;
background:linear-gradient(135deg,var(--accent),#5d7cff);
color:#fff;
padding:11px 18px;
border-radius:11px;
cursor:pointer;
font-weight:bold;
}

footer{
border-top:1px solid var(--border);
text-align:center;
padding:30px;
color:var(--muted);
}

.made-by{
margin-top:8px;
color:#dce1eb;
font-weight:bold;
}

.overlay{
display:none;
position:fixed;
inset:0;
z-index:5000;
background:rgba(0,0,0,.88);
align-items:center;
justify-content:center;
padding:15px;
}

.overlay.show{
display:flex;
}

.game-window{
width:min(900px,100%);
max-height:95vh;
overflow:auto;
background:var(--panel);
border:1px solid var(--border);
border-radius:22px;
padding:15px;
position:relative;
}

.game-top{
display:flex;
align-items:center;
justify-content:space-between;
gap:10px;
margin-bottom:10px;
}

.stats{
display:flex;
gap:15px;
flex-wrap:wrap;
color:#fff;
}

.stat{
background:var(--panel2);
padding:7px 12px;
border-radius:10px;
}

.canvas-wrap{
display:flex;
justify-content:center;
background:#05070c;
border-radius:15px;
overflow:hidden;
}

canvas{
display:block;
max-width:100%;
touch-action:none;
}

.game-controls{
display:flex;
justify-content:center;
gap:10px;
margin-top:12px;
}

.pause-screen,
.result-screen{
display:none;
position:absolute;
inset:0;
background:rgba(8,11,18,.94);
align-items:center;
justify-content:center;
text-align:center;
border-radius:22px;
z-index:20;
}

.pause-screen.show,
.result-screen.show{
display:flex;
}

.result-box{
padding:30px;
}

.result-box h2{
font-size:36px;
margin-bottom:10px;
}

.result-box p{
color:var(--muted);
margin-bottom:20px;
}

@media(max-width:800px){
.games{
grid-template-columns:1fr 1fr;
}
}

@media(max-width:550px){
.games{
grid-template-columns:1fr;
}
}

</style>
</head>

<body>

<nav>
<div class="container nav">

<a class="logo" href="index.html">
<img src="assets/images/logo/logo.png">
<span>PelirFami</span>
</a>

<div class="nav-right">

<a href="index.html" class="btn" data-i18n="backHome"></a>

<button class="btn play" data-game="break" data-i18n="play"></button>
</div>

<div class="game" data-type="mobile" data-game="snake">
<div class="game-icon">🐍</div>
<h3>Fami Snake</h3>
<p data-i18n="snakeDesc"></p>
<button class="btn play" data-game="snake" data-i18n="play"></button>
</div>

<div class="game" data-type="mobile" data-game="tap">
<div class="game-icon">🎯</div>
<h3>Fami Tap</h3>
<p data-i18n="tapDesc"></p>
<button class="btn play" data-game="tap" data-i18n="play"></button>
</div>

<div class="game" data-type="desktop" data-game="pong">
<div class="game-icon">🏓</div>
<h3>Fami Pong</h3>
<p data-i18n="pongDesc"></p>
<button class="btn play" data-game="pong" data-i18n="play"></button>
</div>

</div>

</main>

<footer>

<div>© 2026 PelirFami</div>

<div class="made-by" data-i18n="footerMadeBy"></div>

</footer>

<div id="gameOverlay" class="overlay">

<div class="game-window">

<div class="game-top">

<div class="stats">

<div class="stat">
<span data-i18n="score"></span>:
<span id="score">0</span>
</div>

<div class="stat">
<span data-i18n="record"></span>:
<span id="record">0</span>
</div>

</div>

<button class="btn" id="closeGame" data-i18n="close"></button>

</div>

<div class="canvas-wrap">
<canvas id="canvas" width="800" height="500"></canvas>
</div>

<div class="game-controls">

</div>

<div id="pauseScreen" class="pause-screen">

<div class="result-box">

<button class="btn" id="resumeBtn" data-i18n="resume"></button>

</div>

</div>

<div id="resultScreen" class="result-screen">

<div class="result-box">

<h2 data-i18n="gameOver"></h2>

<p>
<span data-i18n="yourScore"></span>:
<strong id="finalScore">0</strong>
</p>

<p>
<span data-i18n="yourRecord"></span>:
<strong id="finalRecord">0</strong>
</p>

<button class="btn" id="restartBtn" data-i18n="restart"></button>

</div>

<script>

/* =====================================================
LANGUAGE SYSTEM
===================================================== */

const LANG_STORAGE_KEY="pelirfami_language";

const translations={

fa:{
backHome:"صفحه اصلی",
gameCenter:"مرکز بازی",
gameSubtitle:"چند بازی سرگرم‌کننده برای زمانی که می‌خواهید کمی استراحت کنید.",
allGames:"همه بازی‌ها",
mobile:"موبایل",
desktop:"کامپیوتر",
play:"شروع بازی",
flappyDesc:"پرنده را کنترل کن و از موانع عبور کن.",
spaceDesc:"با سفینه دشمنان را نابود کن.",
breakDesc:"آجرها را با توپ نابود کن.",
snakeDesc:"مار را کنترل کن و امتیاز بگیر.",
tapDesc:"هدف‌ها را هرچه سریع‌تر بزن.",
pongDesc:"در برابر کامپیوتر Pong بازی کن.",
score:"امتیاز",
record:"رکورد",
close:"بستن",
pause:"مکث",
paused:"بازی متوقف شد",
resume:"ادامه بازی",
gameOver:"پایان بازی",
yourScore:"امتیاز شما",
yourRecord:"رکورد شما",
restart:"شروع دوباره",
chooseGame:"انتخاب بازی",
footerMadeBy:"ساخته شده توسط محمدمهدی حسن پور"
},

en:{
backHome:"Home",
gameCenter:"Game Center",
gameSubtitle:"Fun games to enjoy while taking a short break.",
allGames:"All Games",
mobile:"Mobile",
desktop:"Computer",
play:"Play",
flappyDesc:"Control the bird and avoid the obstacles.",
spaceDesc:"Destroy enemies with your spaceship.",
breakDesc:"Break the blocks with the ball.",
snakeDesc:"Control the snake and collect points.",
tapDesc:"Hit the targets as quickly as possible.",
pongDesc:"Play Pong against the computer.",
score:"Score",
record:"Record",
close:"Close",
pause:"Pause",
paused:"Game Paused",
resume:"Resume",
gameOver:"Game Over",
yourScore:"Your Score",
yourRecord:"Your Record",
restart:"Restart",
chooseGame:"Choose Game",
footerMadeBy:"Made by Mohammad Mehdi Hassanpour"
},

ar:{
backHome:"الرئيسية",
gameCenter:"مركز الألعاب",
gameSubtitle:"ألعاب ممتعة للاستراحة.",
allGames:"كل الألعاب",
mobile:"الهاتف",
desktop:"الكمبيوتر",
play:"ابدأ",
flappyDesc:"تحكم بالطائر وتجنب العوائق.",
spaceDesc:"دمر الأعداء بسفينتك.",
breakDesc:"حطم الكتل بالكرة.",
snakeDesc:"تحكم بالثعبان واجمع النقاط.",
tapDesc:"اضرب الأهداف بسرعة.",
pongDesc:"العب Pong ضد الكمبيوتر.",
score:"النقاط",
record:"الرقم القياسي",
close:"إغلاق",
pause:"إيقاف مؤقت",
paused:"اللعبة متوقفة",
resume:"متابعة",
gameOver:"انتهت اللعبة",
yourScore:"نقاطك",
yourRecord:"رقمك القياسي",
restart:"إعادة اللعب",
chooseGame:"اختيار لعبة",
footerMadeBy:"صنع بواسطة محمد مهدي حسن بور"
}

};

const languageNames={
fa:"🇮🇷 فارسی",
en:"🇬🇧 English",
ar:"🇸🇦 العربية"
};

function detectLanguage(){

const languages=navigator.languages||[navigator.language];

for(const language of languages){

const code=language.toLowerCase().split("-")[0];

if(translations[code]){
return code;
}

}

return "en";
}

function getLanguage(){

const saved=localStorage.getItem(LANG_STORAGE_KEY);

return saved&&translations[saved]
?saved
:detectLanguage();

}

function setLanguage(lang){

if(!translations[lang]){
lang="en";
}

localStorage.setItem(LANG_STORAGE_KEY,lang);

document.documentElement.lang=lang;

document.documentElement.dir=
["fa","ar"].includes(lang)?"rtl":"ltr";

document.querySelectorAll("[data-i18n]").forEach(el=>{

const key=el.dataset.i18n;

if(translations[lang][key]!==undefined){
el.textContent=translations[lang][key];
}

});

document.getElementById("languageSelector").value=lang;

}

const selector=document.getElementById("languageSelector");

Object.keys(languageNames).forEach(lang=>{

const option=document.createElement("option");

option.value=lang;
option.textContent=languageNames[lang];

selector.appendChild(option);

});

selector.addEventListener("change",()=>{
setLanguage(selector.value);
});

setLanguage(getLanguage());


/* =====================================================
GAME ENGINE
===================================================== */

const overlay=document.getElementById("gameOverlay");
const canvas=document.getElementById("canvas");
const ctx=canvas.getContext("2d");

const scoreEl=document.getElementById("score");
const recordEl=document.getElementById("record");

const pauseScreen=document.getElementById("pauseScreen");
const resultScreen=document.getElementById("resultScreen");

let currentGame=null;
let score=0;
let record=0;
let running=false;
let paused=false;
let animation=null;

function recordKey(game){
return "pelirfami_record_"+game;
}

function loadRecord(game){

record=
Number(localStorage.getItem(recordKey(game)))||0;

recordEl.textContent=record;

}

function updateScore(value){

score=value;
scoreEl.textContent=score;

if(score>record){

record=score;
recordEl.textContent=record;

localStorage.setItem(
recordKey(currentGame),
record
);

}

}

function startGame(game){

currentGame=game;

overlay.classList.add("show");

pauseScreen.classList.remove("show");
resultScreen.classList.remove("show");

score=0;
scoreEl.textContent="0";

loadRecord(game);

running=true;
paused=false;

cancelAnimationFrame(animation);

if(game==="flappy")initFlappy();
if(game==="space")initSpace();
if(game==="break")initBreak();
if(game==="snake")initSnake();
if(game==="tap")initTap();
if(game==="pong")initPong();

}

function gameOver(){

running=false;

cancelAnimationFrame(animation);

document.getElementById("finalScore").textContent=score;
document.getElementById("finalRecord").textContent=record;

resultScreen.classList.add("show");

}

function closeGame(){

running=false;

cancelAnimationFrame(animation);

overlay.classList.remove("show");

}

function restartGame(){

resultScreen.classList.remove("show");

startGame(currentGame);

}

function togglePause(){

if(!running)return;

paused=!paused;

pauseScreen.classList.toggle("show",paused);

if(!paused){

requestFrame();

}

}

function requestFrame(){

if(!running||paused)return;

animation=requestAnimationFrame(loop);

}

function loop(){

if(!running||paused)return;

if(currentGame==="flappy")updateFlappy();
if(currentGame==="space")updateSpace();
if(currentGame==="break")updateBreak();
if(currentGame==="snake")updateSnake();
if(currentGame==="tap")updateTap();
if(currentGame==="pong")updatePong();

requestFrame();

}


/* =====================================================
FLAPPY
===================================================== */

let bird,pipes,flappyFrame;

function initFlappy(){

bird={
x:150,
y:250,
vy:0,
r:18
};

pipes=[];
flappyFrame=0;

requestFrame();

}

function updateFlappy(){

ctx.clearRect(0,0,800,500);

ctx.fillStyle="#07101b";
ctx.fillRect(0,0,800,500);

bird.vy+=.42;
bird.y+=bird.vy;

if(flappyFrame%110===0){

const gap=145;
const top=80+Math.random()*220;

pipes.push({
x:820,
top,
bottom:top+gap,
passed:false
});

}

pipes.forEach(p=>{

p.x-=4;

ctx.fillStyle="#20d67b";

ctx.fillRect(p.x,0,60,p.top);
ctx.fillRect(p.x,p.bottom,60,500-p.bottom);

if(!p.passed&&p.x<bird.x){

p.passed=true;

updateScore(score+1);

}

});

ctx.fillStyle="#ffc857";

ctx.beginPath();
ctx.arc(bird.x,bird.y,bird.r,0,Math.PI*2);
ctx.fill();

if(
bird.y-bird.r<0||
bird.y+bird.r>500||
pipes.some(p=>
bird.x+bird.r>p.x&&
bird.x-bird.r<p.x+60&&
(bird.y-bird.r<p.top||
bird.y+bird.r>p.bottom)
)
){

gameOver();
return;

}

flappyFrame++;

}

function flappyJump(){

if(currentGame!=="flappy"||paused)return;

bird.vy=-8;

}


/* =====================================================
SPACE
===================================================== */

let ship,bullets,enemies,keys;

function initSpace(){

ship={
x:380,
y:430,
w:45,
h:25,
speed:6
};

bullets=[];
enemies=[];
keys={};

requestFrame();

}

function updateSpace(){

ctx.clearRect(0,0,800,500);

ctx.fillStyle="#04070d";
ctx.fillRect(0,0,800,500);

if(keys.ArrowLeft)ship.x-=ship.speed;
if(keys.ArrowRight)ship.x+=ship.speed;

ship.x=Math.max(0,Math.min(755,ship.x));

ctx.fillStyle="#00d4ff";
ctx.fillRect(ship.x,ship.y,ship.w,ship.h);

if(Math.random()<.025){

enemies.push({
x:Math.random()*760,
y:-30,
w:30,
h:25,
speed:2+Math.random()*2
});

}

bullets.forEach(b=>{
b.y-=8;
ctx.fillStyle="#ffc857";
ctx.fillRect(b.x,b.y,5,12);
});

enemies.forEach(e=>{
e.y+=e.speed;

ctx.fillStyle="#ff5570";
ctx.fillRect(e.x,e.y,e.w,e.h);

if(
e.y+e.h>ship.y&&
e.x<ship.x+ship.w&&
e.x+e.w>ship.x
){
gameOver();
}

});

bullets.forEach(b=>{

enemies.forEach(e=>{

if(
b.x>e.x&&
b.x<e.x+e.w&&
b.y<e.y+e.h&&
b.y>e.y
){

e.y=600;

updateScore(score+1);

}

});

});

if(keys.Space){

if(!keys._shot){

bullets.push({
x:ship.x+ship.w/2,
y:ship.y
});

keys._shot=true;

}

}else{

keys._shot=false;

}

requestFrame();

}


/* =====================================================
BREAK
===================================================== */

let paddle,ball,bricks;

function initBreak(){

paddle={
x:340,
y:465,
w:120,
h:15
};

ball={
x:400,
y:300,
vx:4,
vy:-4,
r:9
};

bricks=[];

for(let row=0;row<5;row++){

for(let col=0;col<10;col++){

bricks.push({
x:15+col*78,
y:30+row*25,
w:68,
h:18,
alive:true
});

}

}

requestFrame();

}

function updateBreak(){

ctx.clearRect(0,0,800,500);

ctx.fillStyle="#05070c";
ctx.fillRect(0,0,800,500);

if(keys?.ArrowLeft)paddle.x-=7;
if(keys?.ArrowRight)paddle.x+=7;

paddle.x=Math.max(0,Math.min(680,paddle.x));

ball.x+=ball.vx;
ball.y+=ball.vy;

if(ball.x<ball.r||ball.x>800-ball.r)
ball.vx*=-1;

if(ball.y<ball.r)
ball.vy*=-1;

if(
ball.y+ball.r>paddle.y&&
ball.x>paddle.x&&
ball.x<paddle.x+paddle.w
){

ball.vy=-Math.abs(ball.vy);

}

bricks.forEach(b=>{

if(!b.alive)return;

if(
ball.x>b.x&&
ball.x<b.x+b.w&&
ball.y>b.y&&
ball.y<b.y+b.h
){

b.alive=false;
ball.vy*=-1;

updateScore(score+1);

}

});

if(ball.y>500){

gameOver();
return;

}

ctx.fillStyle="#7c5cff";
ctx.fillRect(paddle.x,paddle.y,paddle.w,paddle.h);

ctx.fillStyle="#ffc857";

ctx.beginPath();
ctx.arc(ball.x,ball.y,ball.r,0,Math.PI*2);
ctx.fill();

bricks.forEach(b=>{

if(b.alive){

ctx.fillStyle="#00d4ff";
ctx.fillRect(b.x,b.y,b.w,b.h);

}

});

requestFrame();

}


/* =====================================================
SNAKE
===================================================== */

let snake,food,direction,snakeTimer;

function initSnake(){

snake=[
{x:10,y:10},
{x:9,y:10},
{x:8,y:10}
];

food={
x:15,
y:10
};

direction={x:1,y:0};

snakeTimer=0;

requestFrame();

}

function updateSnake(){

snakeTimer++;

if(snakeTimer<7)return;

snakeTimer=0;

const head={
x:snake[0].x+direction.x,
y:snake[0].y+direction.y
};

if(
head.x<0||
head.x>=40||
head.y<0||
head.y>=25||
snake.some(s=>s.x===head.x&&s.y===head.y)
){

gameOver();
return;

}

snake.unshift(head);

if(head.x===food.x&&head.y===food.y){

updateScore(score+1);

food={
x:Math.floor(Math.random()*40),
y:Math.floor(Math.random()*25)
};

}else{

snake.pop();

}

ctx.clearRect(0,0,800,500);

ctx.fillStyle="#05070c";
ctx.fillRect(0,0,800,500);

ctx.fillStyle="#20d67b";

snake.forEach(s=>{
ctx.fillRect(s.x*20,s.y*20,18,18);
});

ctx.fillStyle="#ff5570";

ctx.fillRect(food.x*20,food.y*20,18,18);

requestFrame();

}


/* =====================================================
TAP
===================================================== */

let target,tapTime;

function initTap(){

target={
x:Math.random()*700+50,
y:Math.random()*400+50,
r:35
};

tapTime=0;

requestFrame();

}

function updateTap(){

ctx.clearRect(0,0,800,500);

ctx.fillStyle="#05070c";
ctx.fillRect(0,0,800,500);

ctx.fillStyle="#7c5cff";

ctx.beginPath();

ctx.arc(
target.x,
target.y,
target.r,
0,
Math.PI*2
);

ctx.fill();

tapTime++;

if(tapTime>240){

gameOver();
return;

}

requestFrame();

}

function tapTarget(x,y){

if(
currentGame!=="tap"||
paused||
!target
)return;

const dx=x-target.x;
const dy=y-target.y;

if(Math.sqrt(dx*dx+dy*dy)<target.r){

updateScore(score+1);

target={
x:Math.random()*700+50,
y:Math.random()*400+50,
r:Math.max(18,35-score/2)
};

tapTime=0;

}

}


/* =====================================================
PONG
===================================================== */

let player,ai,pongBall;

function initPong(){

player={
x:20,
y:200,
w:15,
h:100
};

ai={
x:765,
y:200,
w:15,
h:100
};

pongBall={
x:400,
y:250,
vx:5,
vy:3
};

requestFrame();

}

function updatePong(){

ctx.clearRect(0,0,800,500);

ctx.fillStyle="#05070c";
ctx.fillRect(0,0,800,500);

if(keys?.ArrowUp)player.y-=7;
if(keys?.ArrowDown)player.y+=7;

player.y=Math.max(0,Math.min(400,player.y));

ai.y+=(pongBall.y-(ai.y+50))*.06;

pongBall.x+=pongBall.vx;
pongBall.y+=pongBall.vy;

if(
pongBall.y<10||
pongBall.y>490
)pongBall.vy*=-1;

if(
pongBall.x<35&&
pongBall.y>player.y&&
pongBall.y<player.y+100
){

pongBall.vx=Math.abs(pongBall.vx);

}

if(
pongBall.x>750&&
pongBall.y>ai.y&&
pongBall.y<ai.y+100
){

pongBall.vx=-Math.abs(pongBall.vx);

}

if(pongBall.x<0){

gameOver();
return;

}

if(pongBall.x>800){

updateScore(score+1);

pongBall={
x:400,
y:250,
vx:-5,
vy:3
};

}

ctx.fillStyle="#fff";

ctx.fillRect(player.x,player.y,player.w,player.h);
ctx.fillRect(ai.x,ai.y,ai.w,ai.h);

ctx.beginPath();

ctx.arc(
pongBall.x,
pongBall.y,
10,
0,
Math.PI*2
);

ctx.fill();

requestFrame();

}


/* =====================================================
CONTROLS
===================================================== */

document.addEventListener("keydown",e=>{

keys=keys||{};

keys[e.code]=true;
keys[e.key]=true;

if(e.code==="Space"){

e.preventDefault();

if(currentGame==="flappy"){
flappyJump();
}

}

if(e.key==="Escape"){
togglePause();
}

});

document.addEventListener("keyup",e=>{

keys=keys||{};

keys[e.code]=false;
keys[e.key]=false;

});

canvas.addEventListener("pointerdown",e=>{

if(currentGame==="flappy"){

flappyJump();

}

if(currentGame==="tap"){

const rect=canvas.getBoundingClientRect();

const x=(e.clientX-rect.left)*(canvas.width/rect.width);
const y=(e.clientY-rect.top)*(canvas.height/rect.height);

tapTarget(x,y);

}

});

document.querySelectorAll(".play").forEach(button=>{

button.addEventListener("click",()=>{

startGame(button.dataset.game);

});

});

document.querySelectorAll(".filter").forEach(button=>{

button.addEventListener("click",()=>{

document.querySelectorAll(".filter")
.forEach(x=>x.classList.remove("active"));

button.classList.add("active");

const filter=button.dataset.filter;

document.querySelectorAll(".game").forEach(game=>{

game.style.display=
filter==="all"||
game.dataset.type===filter
?"block"
:"none";

});

});

});

document.getElementById("closeGame")
.addEventListener("click",closeGame);

document.getElementById("pauseBtn")
.addEventListener("click",togglePause);

document.getElementById("resumeBtn")
.addEventListener("click",togglePause);

document.getElementById("restartBtn")
.addEventListener("click",restartGame);

document.getElementById("chooseBtn")
.addEventListener("click",()=>{

resultScreen.classList.remove("show");
closeGame();

});

document.addEventListener("visibilitychange",()=>{

if(document.hidden&&running&&!paused){

togglePause();

}

});

</script>
